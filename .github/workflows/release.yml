# Baut die ZIP-Datei zum Herunterladen und hängt sie an ein neues Release an.
# Auslöser: ein hochgeladener Versions-Tag, z. B. (vorher "version" in package.json auf 1.0.0 setzen)
#   git tag v1.0.0
#   git push origin v1.0.0
# Ergebnis: tweakable-dj-v<Version>.zip mit dem Ordner tweakable-dj, dazu manifest.json als eigene Datei am Release.
# In die ZIP-Datei kommen nur Dateien, die im Repository sind (git archive), auch die Screenshots in docs/ und das Logo in assets/
# (dort auch die Symbole für die Verknüpfung auf dem Desktop: logo.ico, logo.icns).
# Persönliche Dateien (config.jsonc, tokens.json, state.json, lastfm-cache.json, probelauf.json, das Archiv archiv/) und das
# eigene Node.js (Ordner node/, lädt die Startdatei beim ersten Start) sind per .gitignore nie dabei; der Ablauf prüft das zur
# Sicherheit noch einmal.
# Vorher laufen die Tests (npm test); sind sie rot, wird nichts veröffentlicht.
# manifest.json (Version, jede Datei mit Pfad, Größe, SHA-256 und Ausführbar-Bit, dazu überholte Dateien früherer Releases)
# liegt auch in der ZIP-Datei. Sie ist die Erlaubnisliste für „Jetzt aktualisieren“ (install-update.mjs): Das Update lädt
# manifest.json und die ZIP-Datei, prüft jede Datei, schreibt nur, was dort steht, und löscht nur überholte Dateien mit
# passender Prüfsumme.
# Vorabversionen: Ein Tag mit Vorab-Kennung nach SemVer (z. B. v0.4.0-beta.1 oder v0.4.0-rc.1; "version" in package.json
# genauso) wird ein Release mit der Markierung „Pre-release“, nie „Latest“. Die Update-Prüfung der installierten Programme
# fragt /releases/latest ab – das liefert nur reguläre Releases –, und update.mjs bzw. install-update.mjs lehnen
# Vorabversionen zusätzlich selbst ab. Reguläre Tags (v1.2.3) werden wie bisher ein normales Release („Latest“).
# Tag, package.json und CHANGELOG.md prüft .github/release-check.mjs (getestet in tests/release.test.mjs).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  zip:
    name: ZIP-Datei bauen und veröffentlichen
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # bricht bei Fehlern ab, auch mitten in einer Pipe (-eo pipefail)
    steps:
      - name: Code holen
        uses: actions/checkout@v5
        with:
          # Alle Tags: Dateien früherer Releases für die Liste überholter Dateien in manifest.json (obsolete)
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      # Zuerst (schnell): Der Hinweis auf neue Versionen (update.mjs) vergleicht den Tag des neuesten Releases (ohne v) mit
      # "version" aus package.json. Passen beide nicht zusammen, sähe man den Hinweis auch mit der neuen ZIP-Datei immer
      # wieder. Außerdem: Tag nach SemVer (v1.2.3 bzw. v1.2.3-beta.1) und Abschnitt der Version in CHANGELOG.md (für „Neu in
      # v…“). Ergebnis (outputs): version, prerelease (true/false), title und previous (frühere Releases für obsolete).
      - name: Tag, package.json und CHANGELOG.md prüfen
        id: pruefung
        run: node .github/release-check.mjs "$GITHUB_REF_NAME" $(git tag -l 'v*')

      # Nur veröffentlichen, wenn die Tests grün sind (dieselben wie in test.yml; Browser-Tests mit dem Chrome des Runners).
      # Sonst verteilte „Jetzt aktualisieren“ einen kaputten Stand.
      - name: Tests
        run: npm test

      - name: ZIP-Datei bauen
        env:
          FRUEHER: ${{ steps.pruefung.outputs.previous }}
        run: |
          set -eu
          ordner="tweakable-dj"
          zip_datei="${ordner}-${GITHUB_REF_NAME}.zip"
          mkdir build

          # Nur versionierte Dateien; .github und .gitattributes lässt export-ignore weg.
          git archive --format=tar --prefix="${ordner}/" "$GITHUB_SHA" | tar -x -C build

          # Sicherheitsnetz: persönliche und automatisch angelegte Dateien, Tests und .github
          # dürfen nie in die ZIP-Datei.
          verboten=$(cd "build/${ordner}" && find . \( -name config.jsonc -o -name tokens.json -o -name state.json \
            -o -name lastfm-cache.json -o -name probelauf.json -o -name 'automatik.*' -o -name update-check.json -o -name seen-version.json -o -name jetzt.json -o -name '*.log' \
            -o -path ./tests -o -path ./.github -o -path ./.update -o -path ./archiv -o -path ./node -o -name manifest.json \) -print)
          if [ -n "$verboten" ]; then
            echo "::error::Diese Dateien dürfen nicht veröffentlicht werden: ${verboten}"
            exit 1
          fi

          # Die Startdateien müssen dabei sein, samt dem, was das eigene Node.js lädt, und der festgelegten Node-Version.
          for f in "Tweakable DJ.cmd" "Tweakable DJ.command" start.sh get-node.cmd get-node.sh node-version.txt; do
            if [ ! -f "build/${ordner}/${f}" ]; then
              echo "::error::Startdatei ${f} fehlt."
              exit 1
            fi
          done

          # Die READMEs sollen auch in der ZIP-Datei vollständig sein: Alles, worauf sie relativ verweisen (Screenshots in
          # docs/ in hell und dunkel, zusammen rund 0,7 MB, das Logo assets/logo.png, overview.*.svg, LICENSE, die README der anderen
          # Sprache …), muss dabei sein. Links ins Internet und auf Abschnitte (#…) zählen nicht. LICENSE muss immer mit (MIT: Lizenztext
          # in jeder Kopie).
          (cd "build/${ordner}" && node -e '
            const fs = require("fs");
            const missing = new Set(fs.existsSync("LICENSE") ? [] : ["LICENSE"]);
            for (const readme of ["README.md", "README.de.md"]) {
              const text = fs.readFileSync(readme, "utf8");
              // [Text](Ziel) und ![Bild](Ziel), dazu src="Ziel" bzw. href="Ziel" in HTML und srcset="Ziel" in <picture>
              // (z. B. die dunkle Fassung eines Screenshots; mehrere Ziele durch Komma getrennt, je mit Angabe wie 2x dahinter)
              for (const m of text.matchAll(/\]\(([^)\s]+)(?:\s+"[^"]*")?\)|\b(?:src|href)="([^"]+)"|\bsrcset="([^"]+)"/g)) {
                const targets = m[3] !== undefined ? m[3].split(",").map(s => s.trim().split(/\s+/)[0]).filter(Boolean) : [m[1] ?? m[2]];
                for (const target of targets) {
                  if (/^([a-z][a-z0-9+.-]*:|#|\/\/)/i.test(target)) continue;
                  const file = decodeURIComponent(target.replace(/[?#].*$/, ""));
                  if (!fs.existsSync(file)) missing.add(`${file} (aus ${readme})`);
                }
              }
            }
            if (missing.size) {
              console.log(`::error::Diese Dateien aus den READMEs fehlen in der ZIP-Datei: ${[...missing].join(", ")}`);
              process.exit(1);
            }')

          # Startdateien für Mac und Linux ausführbar machen, auch wenn das Bit
          # beim Einchecken unter Windows verloren gegangen ist.
          chmod +x "build/${ordner}/start.sh" "build/${ordner}/Tweakable DJ.command"

          # manifest.json: Erlaubnisliste für „Jetzt aktualisieren“, mit SHA-256 genau der Bytes, die in die ZIP-Datei
          # kommen (also nach chmod und mit den Zeilenenden aus .gitattributes). Das Skript bricht ab, falls eine
          # persönliche Datei oder ein unzulässiger Pfad dabei wäre.
          # Frühere Releases (alle Tags mit kleinerer Versionsnummer, auch Vorabversionen; siehe release-check.mjs), so entpackt,
          # wie ihre ZIP-Dateien entstanden sind: Ihre Dateien, die es jetzt nicht mehr gibt (z. B. alte Screenshots), kommen mit
          # ihren Prüfsummen als obsolete in manifest.json. Ein Update löscht sie nur, wenn sie genau so im Ordner liegen.
          mkdir frueher
          for frueher_tag in $FRUEHER; do
            mkdir "frueher/${frueher_tag}"
            git archive --format=tar "$frueher_tag" | tar -x -C "frueher/${frueher_tag}"
          done
          node .github/release-manifest.mjs "build/${ordner}" "${GITHUB_REF_NAME#v}" frueher/*
          cp "build/${ordner}/manifest.json" manifest.json
          node -e '
            const m = require("./manifest.json");
            for (const f of ["start.sh", "Tweakable DJ.command"]) {
              if (!m.files.some(x => x.path === f && x.executable)) throw new Error(f + " ist in manifest.json nicht ausführbar");
            }'

          # zip speichert die Unix-Rechte mit, entpackt auf Mac und Linux bleiben sie erhalten.
          (cd build && zip -r -X -9 "../${zip_datei}" "${ordner}")
          unzip -Z "${zip_datei}"
          echo "ZIP_DATEI=${zip_datei}" >> "$GITHUB_ENV"

      # Titel z. B. „Tweakable DJ for Spotify v0.4.0-beta.1 (Vorabversion / pre-release)“. Vorabversion: --prerelease und
      # --latest=false (GitHub macht ein Pre-release ohnehin nie zu „Latest“; doppelt hält besser). Reguläre Version: normales
      # Release wie bisher.
      - name: Release anlegen und ZIP-Datei anhängen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VORAB: ${{ steps.pruefung.outputs.prerelease }}
          TITEL: ${{ steps.pruefung.outputs.title }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Release gibt es schon (z. B. Ablauf erneut gestartet oder von Hand angelegt): nur ZIP-Datei und manifest.json
            # ersetzen; eine Vorabversion sicherheitshalber (wieder) als Pre-release markieren.
            gh release upload "$tag" "$ZIP_DATEI" manifest.json --clobber
            if [ "$VORAB" = "true" ]; then
              gh release edit "$tag" --prerelease --latest=false
            fi
          elif [ "$VORAB" = "true" ]; then
            gh release create "$tag" "$ZIP_DATEI" manifest.json \
              --title "$TITEL" \
              --generate-notes \
              --verify-tag \
              --prerelease \
              --latest=false
          else
            gh release create "$tag" "$ZIP_DATEI" manifest.json \
              --title "$TITEL" \
              --generate-notes \
              --verify-tag
          fi
