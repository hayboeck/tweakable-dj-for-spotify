# Automatische Tests bei jedem Push und Pull Request (npm test, ohne Abhängigkeiten und ohne Netzwerkzugriffe)
# Linux: 18 = Mindestversion (package.json "engines"), 20 und 22 = ältere LTS, 24 = aktuelle LTS, 26 = neueste Version.
# Windows: lts/* = jeweils die neueste LTS, also das, was nodejs.org Windows-Nutzern gerade anbietet (Pfade mit
# Leerzeichen und Umlaut, Zeilenenden, Aufgabenplanung). Ein Windows-Lauf genügt: Unterschiede zwischen den
# Node-Versionen prüfen schon die Linux-Läufe, und Windows-Minuten zählen bei privaten Repositories doppelt.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 22, 24, 26]
        include:
          - os: windows-latest
            node: "lts/*"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
