name: Fehler melden
description: Etwas funktioniert nicht oder anders als in der Anleitung beschrieben.
title: "Fehler: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke, dass du den Fehler meldest! Schau vorher kurz in der README unter **Probleme und Lösungen** nach, vielleicht steht die Lösung schon dort.

        > **Wichtig: Diese Seite ist öffentlich.**
        > Füge **keine Client ID**, **keinen Last.fm-API-Key** und nichts aus `tokens.json`, `config.jsonc` oder `state.json` ein.
        > Steht so etwas in einer Ausgabe, ersetze es vorher durch `***`.

  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du erwartet, und was ist stattdessen passiert? Eine Fehlermeldung bitte wörtlich abschreiben oder hineinkopieren.
    validations:
      required: true

  - type: textarea
    id: schritte
    attributes:
      label: Schritte bis zum Fehler
      description: Was hast du nacheinander gemacht?
      placeholder: |
        1. Tweakable DJ for Spotify gestartet
        2. Auf „Probelauf“ geklickt
        3. Die Meldung „…“ erscheint
    validations:
      required: true

  - type: textarea
    id: ausgabe
    attributes:
      label: Ausgabe des Probelaufs
      description: |
        In der Oberfläche auf **Probelauf** klicken und die Ausgabe hierher kopieren (im Terminal geht auch `node dj.mjs --dry`).
        Die Songliste darfst du kürzen. Vorher prüfen: keine Client ID, kein API-Key, nichts aus `tokens.json`.
      render: text

  - type: dropdown
    id: betriebssystem
    attributes:
      label: Betriebssystem
      options:
        - Windows
        - macOS
        - Linux
        - anderes (bitte oben angeben)
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node-Version
      description: Im Terminal bzw. in der Eingabeaufforderung `node --version` eingeben und das Ergebnis hierher kopieren.
      placeholder: z. B. v22.11.0
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version von Tweakable DJ for Spotify
      description: Steht im Namen der ZIP-Datei, z. B. v1.0.0. Weißt du es nicht, lass das Feld leer.

  - type: checkboxes
    id: zugangsdaten
    attributes:
      label: Zugangsdaten
      options:
        - label: Ich habe keine Client ID, keinen API-Key und nichts aus tokens.json, config.jsonc oder state.json eingefügt.
          required: true
