name: Idee oder Wunsch
description: Schlag eine neue Funktion oder eine Verbesserung vor.
title: "Idee: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deine Idee! Bitte schau kurz nach, ob es schon ein Issue dazu gibt. Wenn ja, schreib lieber dort einen Kommentar.

  - type: textarea
    id: idee
    attributes:
      label: Was wünschst du dir?
      description: Beschreib die Funktion oder Änderung so, wie du sie benutzen würdest.
      placeholder: z. B. „Ein Regler, mit dem ich festlege, wie viele Songs aus den letzten Jahren kommen.“
    validations:
      required: true

  - type: textarea
    id: wozu
    attributes:
      label: Wozu brauchst du das?
      description: Was klappt heute nicht oder ist umständlich? Was würde dadurch besser?
    validations:
      required: true

  - type: textarea
    id: alternativen
    attributes:
      label: Andere Lösungen
      description: Hast du schon etwas anderes probiert, oder gibt es eine andere Möglichkeit? (freiwillig)
