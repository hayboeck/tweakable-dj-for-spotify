name: Report a bug / Fehler melden
description: Something doesn’t work, or works differently than described in the guide. / Etwas funktioniert nicht oder anders als in der Anleitung beschrieben.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting the bug! Please check **Troubleshooting** in the README first; the solution may already be there. You can write in English or German; corrections to the Spanish or French translation are also welcome in Spanish or French.
        Danke, dass du den Fehler meldest! Schau vorher kurz in der README unter **Probleme und Lösungen** nach, vielleicht steht die Lösung schon dort. Du kannst auf Deutsch oder Englisch schreiben; Korrekturen an der spanischen oder französischen Übersetzung gern auch auf Spanisch oder Französisch.

        > **Important: this page is public.** Don’t paste a **Client ID**, a **Last.fm API key** or anything from `tokens.json`, `config.jsonc` or `state.json`. If something like that appears in an output, replace it with `***` first.
        >
        > **Wichtig: Diese Seite ist öffentlich.** Füge **keine Client ID**, **keinen Last.fm-API-Key** und nichts aus `tokens.json`, `config.jsonc` oder `state.json` ein. Steht so etwas in einer Ausgabe, ersetze es vorher durch `***`.

  - type: textarea
    id: what
    attributes:
      label: What happened? / Was ist passiert?
      description: |
        What did you expect, and what happened instead? Please copy an error message word for word or paste it in.
        Was hast du erwartet, und was ist stattdessen passiert? Eine Fehlermeldung bitte wörtlich abschreiben oder hineinkopieren.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Schritte bis zum Fehler
      description: What did you do, one step after another? / Was hast du nacheinander gemacht?
      placeholder: |
        1. Started Tweakable DJ for Spotify / Tweakable DJ for Spotify gestartet
        2. Clicked “Create playlist” / Auf „Playlist erstellen“ geklickt
        3. The message “…” appears / Die Meldung „…“ erscheint
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output of “Create playlist” / Ausgabe von „Playlist erstellen“
      description: |
        Click **Create playlist** in the interface and copy the output here (in a terminal in the Tweakable DJ folder, `node\current\node.exe dj.mjs --dry` on Windows or `node/current/bin/node dj.mjs --dry` on Mac and Linux works too). You may shorten the list of songs. Check first: no Client ID, no API key, nothing from `tokens.json`.
        In der Oberfläche auf **Playlist erstellen** klicken und die Ausgabe hierher kopieren (im Terminal im Ordner von Tweakable DJ geht auch `node\current\node.exe dj.mjs --dry` unter Windows bzw. `node/current/bin/node dj.mjs --dry` auf Mac und Linux). Die Songliste darfst du kürzen. Vorher prüfen: keine Client ID, kein API-Key, nichts aus `tokens.json`.
      render: text

  - type: dropdown
    id: os
    attributes:
      label: Operating system / Betriebssystem
      options:
        - Windows
        - macOS
        - Linux
        - other (please say which above) / anderes (bitte oben angeben)
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version / Node-Version
      description: |
        In the interface: tab *Settings*, section *Program*, e.g. “Node.js 24.21.0 (own, in the Tweakable DJ folder)”. Copy that line here.
        In der Oberfläche: Tab *Einstellungen*, Abschnitt *Programm*, z. B. „Node.js 24.21.0 (eigenes, im Ordner von Tweakable DJ)“. Diese Zeile hierher kopieren.
      placeholder: e.g. / z. B. Node.js 24.21.0 (own)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version of Tweakable DJ for Spotify / Version von Tweakable DJ for Spotify
      description: |
        Shown in the tab Settings under Program (up to 0.2.5: under Version; up to 0.1.4: at the very bottom of the interface) and in the name of the ZIP file, e.g. v0.2.0. If you don’t know it, leave the field empty.
        Steht im Tab Einstellungen unter Programm (bis 0.2.5 unter Version, bis 0.1.4 ganz unten in der Oberfläche) und im Namen der ZIP-Datei, z. B. v0.2.0. Weißt du es nicht, lass das Feld leer.

  - type: checkboxes
    id: credentials
    attributes:
      label: Credentials / Zugangsdaten
      options:
        - label: I haven’t pasted a Client ID, an API key or anything from tokens.json, config.jsonc or state.json. / Ich habe keine Client ID, keinen API-Key und nichts aus tokens.json, config.jsonc oder state.json eingefügt.
          required: true
