// Feste Texte im HTML und alles Dynamische neu zeichnen, ohne die Seite neu zu laden.
function renderLang() {
  document.documentElement.lang = lang;
  for (const node of document.querySelectorAll('[data-t]')) node.textContent = T.page[node.dataset.t];
  for (const node of document.querySelectorAll('[data-html]')) node.innerHTML = T.page[node.dataset.html]; // nur feste Texte aus TEXT
  for (const node of document.querySelectorAll('[data-ph]')) node.placeholder = T.page[node.dataset.ph];
  for (const b of document.querySelectorAll('.lang button')) b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
  $('w-lastfm-save').textContent = $('w-lastfm-save').dataset.saved ? T.page.next : T.page.saveNext;
  build();
  renderHeader();
  renderUpdate();
  if (!loaded) return;
  refresh();
  renderSetup();
  renderSeed();
  renderNotice();
  renderSummary();
  renderImport();
  if (trial) refreshTrial(); // Meldung des Servers in der neuen Sprache
  if ($('w-client').value.trim()) checkClientId();
}

function setLang(next, { save = true } = {}) {
  if (!TEXT[next]) return;
  if (next !== lang) {
    lang = next;
    T = TEXT[lang];
    renderLang();
    // Meldungen des Servers zur Automatik bzw. zu ungültigen Zahlenwerten in der neuen Sprache holen.
    if (save && view === 'settings') loadSchedule();
    if (Object.keys(problems).length) loadProblems();
  }
  if (save) saveLang();
}

// Wahl in der config.jsonc speichern (gibt es sie noch nicht, legt der Server sie aus der Vorlage dieser Sprache an).
// Klappt das nicht, merkt sich der Browser die Wahl und reicht sie beim nächsten Laden nach.
async function saveLang() {
  pendingLang.set(lang);
  try {
    await apiJson('/api/config', { method: 'POST', body: JSON.stringify({ language: lang }) });
    saved.language = current.language = lang;
    pendingLang.set(null);
    if (setup && !setup.configExists) setup.configExists = true;
  } catch {
    // bleibt vorgemerkt
  }
}

// Nur die Meldungen zu ungültigen Zahlenwerten neu holen (in der Sprache der Seite); Regler und Werte bleiben, wie sie sind.
async function loadProblems() {
  try {
    problems = (await apiJson('/api/config')).problems;
    refresh();
  } catch {
    // dann eben in der bisherigen Sprache
  }
}

// Nach dem Laden der Einstellungen: Sprache aus der Config übernehmen bzw. vorgemerkte Wahl nachreichen.
function adoptLang(data) {
  const configured = data.values?.language;
  if (TEXT[configured]) {
    pendingLang.set(null);
    return setLang(configured, { save: false });
  }
  const pending = pendingLang.get();
  if (TEXT[pending]) setLang(pending, { save: false });
  if (TEXT[pending] || (configCreated && data.setup?.configExists)) saveLang();
}

// --- Regler ---

function build() {
  $('preset-grid').replaceChildren(...PRESETS.map(p => {
    const [name, text] = T.presets[p.id];
    p.button = el('button', { type: 'button', className: 'preset', onclick: () => { Object.assign(current, presetValues(p)); refresh(); } },
      [el('b', { textContent: name }), el('span', { textContent: text })]);
    return p.button;
  }));

  const root = $('groups');
  root.replaceChildren();
  const detailsOpen = varietyControl?.details.open ?? false; // bleibt beim Umschalten der Sprache, wie er war
  for (const group of GROUPS) {
    const section = el('section', {}, [el('h2', { textContent: T.groups[group.id] })]);
    let details = null;
    if (group.variety) {
      varietyControl = varietyBox();
      details = el('details', { className: 'more', open: detailsOpen }, [el('summary', { textContent: T.variety.details })]);
      varietyControl.details = details;
      section.append(varietyControl.row, details);
    }
    for (const item of group.items) {
      // Zeilen mit details: true kommen in den Details-Bereich der Gruppe.
      const parent = item.details && details ? details : section;
      const text = textOf(item);
      const id = `f-${item.key}`;
      const out = el('output', { htmlFor: id });
      const hint = el('p', { className: 'hint' });
      const help = el('p', { className: 'help', textContent: text.help ?? '' });
      const reset = el('button', { className: 'reset', type: 'button', onclick: () => set(item.key, defaults[item.key]) });
      let label = el('label', { htmlFor: id, textContent: text.label });
      const control = { item, text, out, hint, reset };
      let input;
      if (item.type === 'toggle') {
        input = el('input', { type: 'checkbox', id, onchange: () => set(item.key, input.checked) });
        parent.append(el('div', { className: 'row' }, [
          el('div', { className: 'row-head' }, [label, el('label', { className: 'switch' }, [input, el('span')])]), help, reset,
        ]));
      } else if (item.type === 'text') {
        input = el('input', { type: 'text', id, maxLength: 200, oninput: () => set(item.key, input.value, false) });
        parent.append(el('div', { className: 'row' }, [el('div', { className: 'row-head' }, [label]), input, help, reset]));
      } else if (item.type === 'seed') {
        input = el('select', { id, onchange: () => set(item.key, input.value) });
        control.note = el('p', { className: 'msg warn' });
        parent.append(el('div', { className: 'row' }, [el('div', { className: 'row-head' }, [label]), input, control.note, help, reset]));
      } else if (item.type === 'choice') {
        // Knöpfe nebeneinander (Aus / Täglich / Wöchentlich), technisch eine Gruppe von Radio-Buttons
        label = el('span', { className: 'label', id: `${id}-label`, textContent: text.label });
        control.radios = item.options.map(value => el('input', { type: 'radio', name: id, value, onchange: () => set(item.key, value) }));
        input = attr(el('div', { className: 'seg', id }, control.radios.map((r, i) => el('label', {}, [r, el('span', { textContent: text.options[item.options[i]] })]))),
          { role: 'radiogroup', 'aria-labelledby': `${id}-label` });
        control.row = el('div', { className: 'row' }, [el('div', { className: 'row-head' }, [label]), input, hint, help, reset]);
      } else if (item.type === 'select') {
        input = el('select', { id, className: 'short', onchange: () => set(item.key, input.value) },
          item.options.map(value => el('option', { value, textContent: text.options[value] })));
        control.row = el('div', { className: 'row' }, [el('div', { className: 'row-head' }, [label]), input, hint, help, reset]);
      } else if (item.type === 'time') {
        // Nur vollständige Uhrzeiten übernehmen; ein halb gelöschtes Feld springt beim Verlassen zurück.
        input = el('input', { type: 'time', id, step: 60, required: true,
          oninput: () => { if (/^\d\d:\d\d$/.test(input.value)) set(item.key, input.value, false); },
          onblur: () => { input.value = current[item.key]; } });
        control.row = el('div', { className: 'row' }, [el('div', { className: 'row-head' }, [label]), input, hint, help, reset]);
      } else if (item.type === 'list') {
        input = el('input', { type: 'text', id, maxLength: 100, placeholder: text.placeholder, autocomplete: 'off' });
        control.tags = attr(el('ul', { className: 'tags' }), { 'aria-label': text.label });
        control.note = attr(el('p', { className: 'msg' }), { role: 'status' });
        const add = () => addToList(item.key, input, control.note);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); add(); } });
        reset.hidden = true;
        parent.append(el('div', { className: 'row' }, [
          el('div', { className: 'row-head' }, [label]),
          el('div', { className: 'add-row' }, [input, el('button', { className: 'btn', type: 'button', textContent: T.list.add, onclick: add })]),
          control.note, help, control.tags,
        ]));
      } else {
        // Bereich, Skala und Meldung zu einem ungültigen Wert setzt refresh().
        input = el('input', { type: 'range', id, oninput: () => set(item.key, Number(input.value)) });
        control.scale = [el('span'), el('span')];
        control.problem = attr(el('p', { className: 'msg err' }), { role: 'status' });
        parent.append(el('div', { className: 'row' }, [
          el('div', { className: 'row-head' }, [label, out]),
          input,
          el('div', { className: 'scale' }, control.scale),
          control.problem, hint, help, reset,
        ]));
      }
      if (control.row) parent.append(control.row);
      control.input = input;
      controls[item.key] = control;
    }
    if (group.status) section.append(scheduleBox());
    root.append(section);
  }
}

// Hauptregler „Abwechslung bei Künstlern“: Stufen 0 … n−1. Passen die vier Werte zu keiner Stufe („Eigene Einstellung“),
// steht er zwischen den Stufen (step any), damit jede Stufe per Ziehen oder Klick erreichbar bleibt.
function varietyBox() {
  const id = 'f-variety';
  const input = el('input', { type: 'range', id, min: 0, step: 1, oninput: () => setVariety(Math.round(Number(input.value))) });
  const out = el('output', { htmlFor: id });
  const scale = [el('span'), el('span')];
  const hint = el('p', { className: 'hint' });
  const note = attr(el('p', { className: 'msg' }), { role: 'status' });
  const help = el('p', { className: 'help', textContent: T.variety.help });
  const reset = el('button', { className: 'reset', type: 'button', onclick: () => setVariety(defaultVariety()) });
  const row = el('div', { className: 'row' }, [
    el('div', { className: 'row-head' }, [el('label', { htmlFor: id, textContent: T.variety.label }), out]),
    input, el('div', { className: 'scale' }, scale), note, hint, help, reset,
  ]);
  return { row, input, out, scale, hint, note, reset };
}

// Index der Stufe, zu der die vier Werte genau passen, sonst −1 (= eigene Einstellung).
const varietyIndex = c => variety.levels.findIndex(l => variety.keys.every(k => c[k] === l.values[k]));
const defaultVariety = () => Math.max(0, varietyIndex(defaults));

// Position zwischen den Stufen für eigene Werte: Mittel der Positionen der vier Werte (linear zwischen den Stufen).
function varietyPosition(c) {
  const last = variety.levels.length - 1;
  const posOf = key => {
    const vals = variety.levels.map(l => l.values[key]);
    const v = c[key];
    if (!Number.isFinite(v)) return last / 2;
    const hits = vals.map((x, i) => (x === v ? i : -1)).filter(i => i >= 0);
    if (hits.length) return hits.reduce((a, b) => a + b) / hits.length;
    for (let i = 0; i < last; i++) if ((v - vals[i]) * (v - vals[i + 1]) < 0) return i + (v - vals[i]) / (vals[i + 1] - vals[i]);
    return Math.abs(v - vals[0]) < Math.abs(v - vals[last]) ? 0 : last;
  };
  let pos = variety.keys.reduce((sum, k) => sum + posOf(k), 0) / variety.keys.length;
  if (Number.isInteger(pos)) pos += pos < last ? 0.4 : -0.4; // nicht genau auf einer Stufe stehen
  return pos;
}

// Hauptregler bewegt: alle vier Werte auf die Stufe setzen. Waren es eigene Werte, darauf hinweisen.
function setVariety(index) {
  const level = variety.levels[index];
  if (!level) return;
  if (varietyIndex(current) < 0) varietyOverwritten = true;
  Object.assign(current, level.values);
  refresh();
}

function renderVariety() {
  const v = varietyControl;
  if (!v) return;
  const levels = variety.levels;
  v.row.hidden = !levels.length;
  if (!levels.length) return;
  const i = varietyIndex(current);
  Object.assign(v.input, { max: levels.length - 1, step: i >= 0 ? 1 : 'any' }); // vor value, sonst wird gerundet
  v.input.value = i >= 0 ? i : varietyPosition(current);
  v.out.textContent = i >= 0 ? T.variety.levels[levels[i].id] : T.variety.custom;
  attr(v.input, { 'aria-valuetext': v.out.textContent });
  v.scale[0].textContent = T.variety.levels[levels[0].id];
  v.scale[1].textContent = T.variety.levels[levels.at(-1).id];
  v.hint.textContent = T.variety.hint(current);
  // Hinweis „überschrieben“, solange die vier Werte vom Gespeicherten abweichen (nach Speichern oder Verwerfen weg).
  if (i < 0) varietyOverwritten = false;
  const overwritten = varietyOverwritten && variety.keys.some(k => current[k] !== saved[k]);
  v.note.className = i < 0 ? 'msg' : 'msg warn';
  v.note.textContent = i < 0 ? T.variety.customHint : overwritten ? T.variety.overwritten : '';
  const d = defaultVariety();
  v.reset.hidden = i === d;
  v.reset.textContent = T.reset(T.variety.levels[levels[d].id]);
}

function set(key, value, refreshInput = true) {
  current[key] = value;
  if (SCHEDULE_KEYS.includes(key)) setMsg($('auto-msg'), '', ''); // alte Meldung passt nicht mehr
  refresh(refreshInput ? null : key);
}

function addToList(key, input, note) {
  const name = input.value.trim().replace(/\s+/g, ' ');
  if (!name) return;
  if (current[key].some(a => a.toLowerCase() === name.toLowerCase())) {
    setMsg(note, 'warn', T.list.duplicate(name));
  } else {
    setMsg(note, '', '');
    set(key, [...current[key], name]);
  }
  input.value = '';
  input.focus();
}

function renderTags(control, list) {
  if (same(control.shown, list)) return;
  control.shown = list;
  const { item, tags, input } = control;
  tags.replaceChildren(...(list.length ? list.map(name => el('li', { className: 'tag' }, [
    el('span', { textContent: name }),
    attr(el('button', { type: 'button', textContent: '×', title: T.list.remove, onclick: () => { set(item.key, current[item.key].filter(a => a !== name)); input.focus(); } }),
      { 'aria-label': T.list.removeName(name) }),
  ])) : [el('li', { className: 'empty', textContent: T.list.empty })]));
}

// Bereich des Schiebereglers: der übliche (slider), erweitert bis zum gespeicherten bzw. eingestellten Wert, aber nie über
// den erlaubten hinaus. So zeigt er auch größere Werte aus der config.jsonc an, ohne sie beim Speichern abzuschneiden:
// Gespeichert wird ein Regler nur, wenn man ihn bewegt.
function sliderRange(key) {
  const l = limits[key];
  const values = [saved[key], current[key]].filter(Number.isFinite);
  return [Math.max(l.min, Math.min(l.slider[0], ...values)), Math.min(l.max, Math.max(l.slider[1], ...values))];
}

function setSlider(control, v) {
  const { item, input, text, scale } = control;
  if (!limits[item.key]) return;
  const [min, max] = sliderRange(item.key);
  Object.assign(input, { min, max, step: limits[item.key].step }); // vor value, sonst schneidet der alte Bereich ab
  input.value = v;
  scale[0].textContent = text.fmt(min);
  scale[1].textContent = text.fmt(max);
}

const presetValues = p => Object.fromEntries(PRESET_KEYS.map(k => [k, p.values[k] ?? defaults[k]]));
const matchingPreset = () => PRESETS.find(p => Object.entries(presetValues(p)).every(([k, v]) => current[k] === v));

function refresh(skipInput) {
  for (const control of Object.values(controls)) {
    const { item, text, input, out, hint, reset } = control;
    const v = current[item.key];
    if (item.key !== skipInput) {
      if (item.type === 'toggle') input.checked = v;
      else if (item.type === 'seed') fillSeedSelect(input, v);
      else if (item.type === 'list') renderTags(control, v ?? []);
      else if (item.type === 'choice') control.radios.forEach(r => { r.checked = r.value === v; });
      else if (!item.type) setSlider(control, v);
      else input.value = v;
    }
    // Ungültiger Wert aus der config.jsonc: Meldung, solange er unverändert ist.
    if (control.problem) control.problem.textContent = same(v, saved[item.key]) ? problems[item.key] ?? '' : '';
    if (control.row) control.row.hidden = Boolean(item.show) && !item.show(current);
    if (item.type === 'seed') control.note.textContent = seedNoteText();
    out.textContent = item.type ? '' : text.fmt(v);
    hint.textContent = text.hint ? text.hint(v, current) : '';
    if (item.type === 'list') continue;
    reset.hidden = same(v, defaults[item.key]);
    const d = defaults[item.key];
    reset.textContent = T.reset(item.type === 'toggle' ? (d ? T.on : T.off) : item.type === 'text' ? d : text.fmt(d));
  }
  renderVariety();
  if (loaded) renderNotice(); // Hinweis zu „Gefolgte Künstler“ hängt am Regler
  const match = matchingPreset();
  for (const p of PRESETS) p.button.setAttribute('aria-pressed', String(p === match));
  $('preset-state').textContent = match ? T.presetMatch(T.presets[match.id][0]) : T.presetNone;
  $('preset-state').className = match ? 'hint' : 'help';

  const isDirty = dirty();
  const working = isWorking(); // Lauf, Import oder Update: dann weder speichern noch etwas Neues starten
  $('status').textContent = view === 'setup' ? T.status.setup : busy ? T.status.running : updating() ? T.status.updating
    : importRunning ? T.status.importing : isDirty ? T.status.dirty : T.status.saved;
  $('status').classList.toggle('dirty', view !== 'setup' && isDirty && !working);
  $('save').disabled = working || !isDirty;
  $('discard').disabled = working || !isDirty;
  $('dry').disabled = working;
  $('run').disabled = working;
  $('update-install').disabled = working;
  $('export').disabled = working;
  $('import').disabled = working;
  $('import-go').disabled = working;
  $('files-help').textContent = T.files.help(saved.playlistName ?? '');
  renderSchedule();
  renderTrial();
}

const isWorking = () => busy || updating() || importRunning;

// keepEdits: ungespeicherte Regler-Änderungen behalten (z. B. nach dem Assistenten oder der Anmeldung).
async function load(keepEdits = false) {
  const data = await apiJson('/api/config');
  const edits = keepEdits ? Object.fromEntries(ITEMS.filter(i => !same(current[i.key], saved[i.key])).map(i => [i.key, current[i.key]])) : {};
  saved = { ...data.values };
  current = { ...data.values, ...edits };
  defaults = data.defaults;
  limits = data.limits;
  problems = data.problems;
  setup = data.setup;
  variety = data.variety ?? variety;
  varietyOverwritten = false;
  loaded = true;
  adoptLang(data);
  refresh();
  if (varietyControl && (varietyIndex(current) < 0 || variety.keys.some(k => problems[k]))) varietyControl.details.open = true;
  renderSetup();
  renderNotice();
}

async function save() {
  const changes = Object.fromEntries(ITEMS.filter(i => !same(current[i.key], saved[i.key])).map(i => [i.key, current[i.key]]));
  if (typeof changes.playlistName === 'string' && !changes.playlistName.trim()) throw new Error(T.emptyName);
  const scheduleChanged = SCHEDULE_KEYS.some(k => k in changes);
  let res;
  try {
    res = await apiJson('/api/config', { method: 'POST', body: JSON.stringify(changes) });
  } catch (e) {
    if (scheduleChanged) setMsg($('auto-msg'), 'err', e.message);
    throw e;
  }
  saved = { ...current };
  for (const key of Object.keys(changes)) delete problems[key]; // jetzt gültig gespeichert
  if (res.schedule) {
    scheduleInfo = res.schedule;
    setMsg($('auto-msg'), 'ok', saved.schedule === 'off' ? T.auto.savedOff : T.auto.savedOn(T.auto.place[scheduleInfo.platform]));
  }
  refresh();
  if ('playlistName' in changes) loadPlaylists();
  if (trial) refreshTrial();
}

// --- Automatik ---

const when = iso => T.when(new Date(iso));
// Lauf an abgelaufener bzw. fehlender Anmeldung gescheitert und seitdem nicht neu angemeldet?
const loginNeeded = r => r?.ok === false && LOGIN_CODES.includes(r.errorCode) && !(setup?.authorizedAt > Date.parse(r.finishedAt));
const firstLine = (text, max = 160) => {
  const line = String(text ?? '').split('\n')[0];
  return line.length > max ? `${line.slice(0, max - 3)} …` : line;
};

function scheduleBox() {
  const fix = el('button', { type: 'button', className: 'btn small', id: 'auto-fix', onclick: fixSchedule });
  return el('div', { className: 'row', id: 'auto-status' }, [
    el('p', { className: 'help', id: 'auto-platform' }),
    // Sonst bliebe der Eintrag im Zeitplaner stehen und jeder Lauf scheiterte unbemerkt (README „Deinstallieren“).
    el('p', { className: 'help', id: 'auto-uninstall' }),
    attr(el('p', { className: 'msg warn', id: 'auto-pending' }), { role: 'status' }),
    el('dl', { className: 'facts', id: 'auto-facts' }),
    el('div', { className: 'auto-problem', id: 'auto-problem', hidden: true }, [el('p', { id: 'auto-problem-text' }), fix]),
    attr(el('p', { className: 'msg', id: 'auto-msg' }), { role: 'status' }),
  ]);
}

// Letzter automatischer Lauf aus automatik.json: Zeit · ✓ 50 Songs bzw. ✗ Grund – aus den Zahlen und errorCode in der
// Sprache der Seite; bei errorCode 'other' die erste Zeile von error, so wie sie dort steht.
function lastRunView(r) {
  const time = `${when(r.finishedAt ?? r.startedAt)} · `;
  if (r.ok === null) {
    const running = Date.now() - Date.parse(r.startedAt) < 35 * 60_000; // Windows bricht nach 30 Minuten ab
    return [time, el('span', { className: running ? '' : 'err', textContent: running ? T.auto.running : T.auto.aborted })];
  }
  if (r.ok) {
    // songs fehlt nur, wenn der Lauf ohne eigenes Ergebnis endete (Sicherheitsnetz in recordAutoRun)
    const result = T.auto.ok(typeof r.songs === 'number' ? r.songs : null, r.dry);
    return [time, el('span', { className: 'ok', textContent: result }),
      ...(r.playlistUrl ? [' · ', el('a', { href: r.playlistUrl, target: '_blank', rel: 'noopener', textContent: T.auto.open })] : [])];
  }
  if (LOGIN_CODES.includes(r.errorCode)) {
    const again = el('button', { type: 'button', className: 'link', textContent: T.auto.loginAgain, onclick: () => { startLogin(); scrollTo(0, 0); } });
    return [time, el('span', { className: 'err', textContent: T.auto.failed(T.errors[r.errorCode]) }), ' ', loginNeeded(r) ? again : T.auto.loginRenewed];
  }
  const reason = T.errors[r.errorCode] ?? firstLine(r.error);
  return [time, el('span', { className: 'err', textContent: T.auto.failed(reason) }),
    el('span', { className: 'help', textContent: ` ${T.auto.logHint}` })];
}

// Erklärung und Button zu info.problem; ein Eintrag unter einem früheren Namen (legacyNames) hat einen eigenen Text.
function problemText(info, on) {
  if (info.legacy && info.problem === 'leftover' && info.legacyNames?.length) return [T.auto.legacy(info.legacyNames, on), T.auto.legacyButton(on)];
  return T.auto.problems[info.problem] ?? [T.auto.invalid(info.message), null];
}

function renderSchedule() {
  const box = $('auto-status');
  if (!box || !controls.schedule) return;
  const info = scheduleInfo;
  const pending = SCHEDULE_KEYS.some(k => !same(current[k], saved[k]));
  const unsupported = Boolean(info && !info.supported);
  const place = T.auto.place[info?.platform];
  // Wo die Automatik nicht geht, bleibt nur "Aus".
  controls.schedule.radios.forEach(r => { r.disabled = scheduleBusy || (unsupported && r.value !== 'off'); });

  const platform = $('auto-platform');
  platform.textContent = unsupported ? info.message : current.schedule !== 'off' ? [T.auto.background, T.auto.platform[info?.platform]].filter(Boolean).join(' ') : '';
  platform.className = unsupported ? 'msg warn' : 'help';
  $('auto-uninstall').textContent = !unsupported && current.schedule !== 'off' ? T.auto.beforeDelete : '';
  $('auto-pending').textContent = pending && !unsupported ? (current.schedule === 'off' ? T.auto.pendingOff : T.auto.pendingOn(place)) : '';

  const facts = [];
  if (info?.nextRun && !pending) facts.push([T.auto.next, [when(info.nextRun)]]);
  if (info?.lastRun?.startedAt) facts.push([T.auto.last, lastRunView(info.lastRun)]);
  $('auto-facts').replaceChildren(...facts.flatMap(([k, v]) => [el('dt', { textContent: k }), el('dd', {}, v)]));
  $('auto-facts').hidden = !facts.length;

  const problem = info?.supported && !info.matches && !pending ? info.problem : null;
  $('auto-problem').hidden = !problem;
  if (problem) {
    const [text, button] = problemText(info, saved.schedule !== 'off');
    $('auto-problem-text').textContent = text + (problem === 'disabled' && info.platform === 'darwin' ? T.auto.disabledMac : '');
    $('auto-fix').textContent = button ?? '';
    $('auto-fix').hidden = !button;
    $('auto-fix').disabled = scheduleBusy;
  }
  box.hidden = ![...box.children].some(c => !c.hidden && c.textContent.trim());
}

async function loadSchedule() {
  try {
    scheduleInfo = await apiJson('/api/schedule');
  } catch (e) {
    scheduleInfo = null;
    setMsg($('auto-msg'), 'err', T.auto.statusError(e.message));
  }
  renderSchedule();
  renderNotice();
  watchSchedule();
}

// Die Seite bleibt oft lange offen: Läuft gerade ein automatischer Lauf, alle 10 s nachsehen, bis er fertig ist;
// sonst kurz nach dem nächsten geplanten Lauf. Sonst bliebe "läuft gerade …" stehen, obwohl er längst fertig ist.
let scheduleTimer = null;
function watchSchedule() {
  clearTimeout(scheduleTimer);
  const last = scheduleInfo?.lastRun;
  const running = last?.startedAt && last.ok === null && Date.now() - Date.parse(last.startedAt) < 35 * 60_000;
  const untilNext = scheduleInfo?.nextRun ? Date.parse(scheduleInfo.nextRun) - Date.now() + 30_000 : NaN;
  const wait = running ? 10_000 : untilNext > 0 && untilNext < 24 * 3600_000 ? untilNext : null;
  if (wait != null) scheduleTimer = setTimeout(() => { if (view === 'settings') loadSchedule(); }, wait);
}

// "Automatik speichern" bzw. "Eintrag entfernen": gespeicherte Einstellung neu eintragen.
async function fixSchedule() {
  scheduleBusy = true;
  renderSchedule();
  try {
    scheduleInfo = await apiJson('/api/schedule', { method: 'POST' });
    setMsg($('auto-msg'), 'ok', scheduleInfo.installed ? T.auto.savedOn(T.auto.place[scheduleInfo.platform]) : T.auto.removed);
  } catch (e) {
    setMsg($('auto-msg'), 'err', e.message);
  } finally {
    scheduleBusy = false;
    renderSchedule();
  }
}

// --- Probelauf und Neuerstellung ---

// Ergebnis des Laufs: letzte Zeile "@@RESULT {json}" der Ausgabe. Die schickt der Server immer mit (auch wenn dj.mjs
// abstürzt); null nur, wenn sie trotzdem fehlt oder kaputt ist.
function runResult(text) {
  const line = text.replace(/\r/g, '').split('\n').reverse().find(l => l.startsWith('@@RESULT '));
  try {
    return line ? JSON.parse(line.slice('@@RESULT '.length)) : null;
  } catch {
    return null;
  }
}

// Ausgabe ohne Steuerzeilen (@@…); Fehler, Warnungen und aktuelles Hören hervorheben.
function renderLog(text) {
  const lines = text.replace(/\r/g, '').split('\n');
  const last = lines.length - 1; // noch unvollständige Zeile: auch ein angefangenes "@@" nicht zeigen
  $('log').replaceChildren(...lines.filter((line, i) => !line.startsWith('@@') && !(i === last && line.startsWith('@'))).map(line => {
    const span = el('span', { textContent: line + '\n' });
    const start = line.trimStart();
    if (/^(Fehler|Error):/.test(start)) span.className = 'err';
    else if (start.startsWith('⚠')) span.className = 'warn';
    else if (line.includes(' · aktuell') || line.includes(' · current')) span.className = 'now';
    return span;
  }));
}

function runSummary(r) {
  if (r?.ok) return T.run.ok(r, r.dry) + (r.dry ? T.run.unchanged : '');
  return T.errors[r?.errorCode] ? T.run.failedWith(T.errors[r.errorCode]) : T.run.failed;
}

function renderSummary() {
  if (!runState) return;
  const { phase, kind, result } = runState;
  $('summary').textContent = phase === 'running' ? T.run.running(kind) : phase === 'error' ? T.run.failedShort : runSummary(result);
  const link = phase === 'done' && result?.ok && !result.dry && /^https:\/\/open\.spotify\.com\//.test(result.playlistUrl ?? '');
  $('open').hidden = !link;
  if (link) $('open').href = result.playlistUrl;
  renderTrial();
}

// kind: 'dry' (Probelauf), 'run' (Playlist neu erstellen) oder 'apply' (Probelauf übernehmen). Vor einem Probelauf bzw. einer
// Neuerstellung werden ungespeicherte Änderungen gespeichert; danach gilt ein früherer Probelauf nicht mehr.
async function run(kind) {
  const dry = kind === 'dry';
  showError('');
  if (kind !== 'apply') {
    try {
      if (dirty()) await save();
    } catch (e) {
      return showError(e.message);
    }
    trial = null;
  }
  const settings = { ...current }; // Einstellungen dieses Probelaufs
  busy = true;
  refresh();
  $('out').hidden = false;
  runState = { phase: 'running', kind, dry, result: null };
  renderSummary();
  let text = '';
  try {
    const res = kind === 'apply'
      ? await api('/api/apply', { method: 'POST', body: JSON.stringify({ id: trial.id }) })
      : await api(`/api/run${dry ? '?dry=1' : ''}`, { method: 'POST' });
    if (!res.ok) throw new Error((await res.json()).error);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      text += decoder.decode(value, { stream: true });
      renderLog(text);
      $('log').scrollTop = $('log').scrollHeight;
    }
    text += decoder.decode();
    renderLog(text);
    const result = runResult(text);
    runState = { phase: 'done', kind, dry, result };
    if (LOGIN_CODES.includes(result?.errorCode)) showNotice('expired');
    if (dry && result?.ok && result.trialId) {
      trial = { id: result.trialId, settings, expiresAt: new Date(Date.now() + 24 * 3600_000).toISOString(), serverReason: null, message: '' };
      refreshTrial();
    } else if (kind === 'apply' && result?.errorCode === 'trial_expired') {
      Object.assign(trial, { serverReason: 'server', message: result.error });
    } else if (kind === 'apply' && result?.ok) {
      trial = null; // steht jetzt in der Playlist
    }
    scopeFailed = result?.missingScope === FOLLOW_SCOPE;
    // Der Lauf hat das Token eventuell erneuert und dabei die erteilten Berechtigungen gespeichert (setup.missingScopes).
    apiJson('/api/config').then(d => { setup = d.setup; renderNotice(); }).catch(() => {});
  } catch (e) {
    runState = { phase: 'error', kind, dry, result: null };
    showError(e.message);
  } finally {
    busy = false;
    renderSummary();
    refresh();
  }
}

// --- Probelauf übernehmen ---

// Einstellungen, die die Auswahl bestimmen (die Automatik nicht): Weichen sie vom Probelauf ab, passt seine Liste nicht mehr.
const trialChanged = () => ITEMS.some(i => !SCHEDULE_KEYS.includes(i.key) && !same(current[i.key], trial.settings[i.key]));

// Warum sich der Probelauf nicht mehr übernehmen lässt: 'dirty' (Einstellungen geändert), 'old' (älter als 24 Stunden),
// sonst ein Grund vom Server (dann steht der Text in trial.message); null = geht.
function trialReason() {
  if (!trial) return null;
  if (trial.serverReason && trial.serverReason !== 'settings') return trial.serverReason;
  if (trialChanged() || trial.serverReason === 'settings') return 'dirty';
  if (Date.now() >= Date.parse(trial.expiresAt)) return 'old';
  return null;
}

function renderTrial() {
  const show = Boolean(trial) && runState?.phase === 'done' && (runState.kind === 'dry' || runState.kind === 'apply');
  $('trial').hidden = !show;
  clearTimeout(trialTimer);
  if (!show) return;
  const reason = trialReason();
  const working = isWorking();
  $('trial-apply').disabled = working || Boolean(reason);
  // Speichern geht, solange probelauf.json zu diesem Probelauf gehört (auch mit geänderten Einstellungen).
  $('trial-export').disabled = working || ['missing', 'replaced', 'invalid', 'server'].includes(trial.serverReason);
  const msg = $('trial-msg');
  if (reason) setMsg(msg, 'warn', T.trial[reason] ?? trial.message);
  else if (trial.exported) setMsg(msg, 'ok', trial.exported);
  else setMsg(msg, '', T.trial.help(saved.playlistName ?? '', when(trial.expiresAt)));
  // Nach Ablauf der 24 Stunden von selbst sperren
  const left = Date.parse(trial.expiresAt) - Date.now();
  if (!reason && left > 0) trialTimer = setTimeout(renderTrial, Math.min(left + 500, 2 ** 31 - 1));
}

// Beim Server nachfragen (GET /api/trial), ob der Probelauf noch gilt: z. B. nach dem Speichern, nach der Rückkehr auf die
// Seite oder in der Zwischenzeit ein Lauf von der Automatik oder im Terminal.
async function refreshTrial() {
  const id = trial?.id;
  if (!id) return;
  try {
    const data = await apiJson(`/api/trial?id=${encodeURIComponent(id)}`);
    if (trial?.id !== id) return;
    trial.serverReason = data.reason;
    trial.message = data.message;
    if (data.trial?.id === id) trial.expiresAt = data.trial.expiresAt;
  } catch {
    // Server nicht erreichbar: beim Klick prüft er ohnehin noch einmal
  }
  renderTrial();
}

async function applyTrial() {
  delete trial.exported;
  await refreshTrial();
  if (!trialReason()) run('apply');
}

// Datei im Browser herunterladen (UTF-8)
function download(text, filename) {
  const href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
  const a = el('a', { href, download: filename });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(href), 10_000);
}

async function exportTrial() {
  try {
    const r = await apiJson(`/api/export?trial=${encodeURIComponent(trial.id)}`);
    download(r.text, r.filename);
    trial.exported = T.files.saved(r.filename, r.songs);
  } catch (e) {
    if (e.data?.reason) Object.assign(trial, { serverReason: e.data.reason, message: e.message });
    else showError(e.message);
  }
  renderTrial();
}

// --- Textdatei: Playlist speichern und importieren ---

// Playlist, wie sie gerade in Spotify ist (GET /api/export)
async function exportPlaylist() {
  setImport(null);
  setMsg($('files-msg'), '', T.files.loading);
  $('export').disabled = true;
  try {
    const r = await apiJson('/api/export');
    download(r.text, r.filename);
    setMsg($('files-msg'), 'ok', T.files.saved(r.filename, r.songs));
  } catch (e) {
    setMsg($('files-msg'), 'err', e.message);
    if (e.data?.login && setup?.loggedIn) showNotice('expired');
  } finally {
    refresh();
  }
}

function setImport(state) {
  importState = state;
  renderImport();
}

function renderImport() {
  const s = importState;
  const preview = s?.phase === 'preview' ? s.result : null;
  $('import-preview').hidden = !preview;
  if (!s) return setMsg($('files-msg'), '', '');
  if (s.phase === 'busy') setMsg($('files-msg'), '', s.text);
  else if (s.phase === 'error') setMsg($('files-msg'), 'err', s.text);
  else if (s.phase === 'done') {
    const link = /^https:\/\/open\.spotify\.com\//.test(s.written.playlistUrl ?? '')
      ? el('a', { href: s.written.playlistUrl, target: '_blank', rel: 'noopener', textContent: T.files.open }) : '';
    setMsg($('files-msg'), 'ok', T.files.done(s.written.playlistName, s.written.songs), link);
  } else setMsg($('files-msg'), s.error ? 'err' : '', s.error ?? '');
  if (!preview) return;
  $('import-found').textContent = T.files.found(preview.found, preview.total);
  const missing = preview.notFound;
  $('import-missing-head').textContent = missing.length ? T.files.missingHead(missing.length) : '';
  $('import-missing-head').hidden = !missing.length;
  $('import-missing').hidden = !missing.length;
  $('import-missing').replaceChildren(...missing.map(n => el('li', {}, [
    T.files.line(n.line), el('span', { textContent: n.text }), el('span', { className: 'why', textContent: ` – ${T.files.reasons[n.reason] ?? n.reason}` }),
  ])));
  $('import-go').hidden = !preview.found;
  $('import-go').textContent = T.files.write(preview.playlistName);
  $('import-cancel').textContent = T.files.cancel;
  if (!preview.found) setMsg($('files-msg'), 'warn', T.files.none);
}

// Schritt 1: Datei lesen, an den Server schicken und den Fortschritt der Suche zeigen; danach die Vorschau.
async function importPreview(file) {
  showError('');
  if (file.size > 1_000_000) return setImport({ phase: 'error', text: T.files.tooLarge });
  importRunning = true;
  refresh();
  setImport({ phase: 'busy', text: T.files.reading(file.name) });
  try {
    const res = await api('/api/import/preview', { method: 'POST', body: await file.text(), headers: { 'Content-Type': 'text/plain; charset=utf-8' } });
    if (!res.ok) throw new Error((await res.json()).error);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let text = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      text += decoder.decode(value, { stream: true });
      // letzte vollständige Zeile ohne Steuerzeilen (@@…)
      const lines = text.replace(/\r/g, '').split('\n').slice(0, -1).filter(l => l.trim() && !l.startsWith('@@'));
      if (lines.length) setImport({ phase: 'busy', text: lines[lines.length - 1].trim() });
    }
    const result = runResult(text + decoder.decode());
    if (!result?.ok) {
      if (LOGIN_CODES.includes(result?.errorCode)) showNotice('expired');
      throw new Error(result?.error ?? T.files.failed);
    }
    setImport({ phase: 'preview', result, file: file.name });
  } catch (e) {
    setImport({ phase: 'error', text: e.message });
  } finally {
    importRunning = false;
    refresh();
  }
}

// Schritt 2 (nach der Rückfrage): gefundene Songs in die Playlist schreiben.
async function importWrite() {
  const s = importState;
  if (s?.phase !== 'preview' || !s.result.found) return;
  importRunning = true;
  refresh();
  setMsg($('files-msg'), '', T.files.writing(s.result.playlistName));
  $('import-preview').hidden = true;
  try {
    const written = await apiJson('/api/import', { method: 'POST', body: JSON.stringify({ uris: s.result.uris }) });
    setImport({ phase: 'done', written });
  } catch (e) {
    if (e.data?.login && setup?.loggedIn) showNotice('expired');
    setImport({ ...s, error: e.message });
  } finally {
    importRunning = false;
    refresh();
  }
}

// --- Quelle der Favoriten ---

function seedLabel(o) {
  const count = o.tracks != null ? ` · ${T.seed.songs(o.tracks)}` : '';
  return o.value === 'liked' ? `${T.seed.likedLong}${count}` : `${o.name}${o.collaborative ? T.seed.collaborative : ''}${count}`;
}
const seedName = v => (v === 'liked' ? T.seed.liked : seedOptions?.find(o => o.value === v)?.name ?? T.seed.playlist);
const seedNoteText = () => (!seedNote ? '' : seedNote.key === 'error' ? T.seed.error(seedNote.msg) : seedNote.key === 'raw' ? seedNote.msg : T.seed[seedNote.key]);

function fillSeedSelect(select, value) {
  const options = seedOptions ?? [{ value: 'liked', tracks: null }];
  const known = !value || options.some(o => o.value === value);
  // Eingestellte Playlist, die (noch) nicht in der Liste steht: z. B. während die Liste lädt oder bei einer fremden Playlist.
  const other = seedOptions ? T.seed.other : T.seed.configured;
  select.replaceChildren(
    ...options.map(o => el('option', { value: o.value, textContent: seedLabel(o) })),
    ...(known ? [] : [el('option', { value, textContent: other, title: value })]),
  );
  select.value = value ?? 'liked';
}

async function loadPlaylists() {
  if (!setup?.loggedIn) {
    seedOptions = null;
    seedNote = { key: 'login' };
    return renderSeed();
  }
  seedNote = { key: 'loading' };
  renderSeed();
  try {
    seedOptions = (await apiJson('/api/playlists')).options;
    seedNote = null;
  } catch (e) {
    seedOptions = null;
    seedNote = { key: 'error', msg: e.message };
    if (e.data?.login && setup.loggedIn) showNotice('expired');
  }
  renderSeed();
}

function renderSeed() {
  refresh();
  if (setup) fillSeedSelect($('w-seed'), $('w-seed').value || current.seed || 'liked');
  $('w-seed-note').textContent = seedNoteText();
}

// --- Anmeldung bei Spotify (Assistent und Hinweis) ---

function loginBox(parent, label) {
  const start = el('button', { type: 'button', className: 'btn primary', onclick: startLogin });
  const cancel = el('button', { type: 'button', className: 'btn', onclick: cancelLogin });
  const link = el('a', { target: '_blank', rel: 'noopener' });
  const msg = attr(el('p', { className: 'msg' }), { role: 'status' });
  const help = el('p', { className: 'help' });
  parent.replaceChildren(el('div', { className: 'login-box' }, [el('div', { className: 'actions' }, [start, cancel]), msg, help]));
  loginBoxes.push({ start, cancel, link, msg, help, label });
}

function renderLogin() {
  const s = loginState;
  const pending = s.status === 'pending';
  for (const b of loginBoxes) {
    b.start.textContent = b.label();
    b.start.disabled = pending;
    b.cancel.textContent = T.login.cancel;
    b.cancel.hidden = !pending;
    b.link.textContent = T.login.openPage;
    b.help.textContent = T.login.help;
    b.help.hidden = !pending;
    if (pending) {
      if (s.authUrl) b.link.href = s.authUrl;
      setMsg(b.msg, '', T.login.pending, ...(s.authUrl ? [T.login.noTab, b.link] : []));
    } else {
      setMsg(b.msg, s.status === 'ok' ? 'ok' : s.status === 'error' ? 'err' : '', s.key ? T.login[s.key] : s.message ?? '');
    }
  }
}

function setLogin(state) {
  const wasPending = loginState.status === 'pending';
  loginState = state;
  renderLogin();
  clearTimeout(loginTimer);
  if (state.status === 'pending') loginTimer = setTimeout(pollLogin, 1500);
  if (state.status === 'ok' && wasPending) loggedIn();
}

async function pollLogin() {
  try {
    setLogin(await apiJson('/api/login'));
  } catch {
    loginTimer = setTimeout(pollLogin, 3000); // Server kurz nicht erreichbar? Weiter versuchen.
  }
}

async function startLogin() {
  showError('');
  try {
    setLogin(await apiJson('/api/login', { method: 'POST' }));
  } catch (e) {
    setLogin({ status: 'error', message: e.message });
  }
}

async function cancelLogin() {
  try {
    setLogin(await apiJson('/api/login', { method: 'DELETE' }));
  } catch (e) {
    setLogin({ status: 'error', message: e.message });
  }
}

async function loggedIn() {
  if (!$('notice').hidden) noticeReason = 'done';
  scopeFailed = false;
  try {
    await load(true);
  } catch (e) {
    showError(e.message);
  }
  loadPlaylists();
  if (view === 'setup' && activeStep === 3) openStep(4, true);
}

function showNotice(reason) {
  noticeReason = reason;
  // Alte Meldung ("Angemeldet ✓" von früher) passt nicht mehr zum neuen Hinweis.
  if (loginState.status !== 'pending') setLogin({ status: 'idle', message: '' });
  renderNotice();
}

// Fehlt der Anmeldung die Berechtigung für gefolgte Künstler? Bekannt aus tokens.json (setup.missingScopes), aus dem
// letzten Lauf hier oder aus dem letzten automatischen Lauf (seitdem nicht neu angemeldet). Nur wichtig, wenn der Regler
// nicht auf „egal“ steht – sonst fragt der DJ die Liste gar nicht ab.
function scopeNeeded() {
  if (!setup?.loggedIn || !current.followedArtists) return false;
  const last = scheduleInfo?.lastRun;
  const autoFailed = last?.missingScope === FOLLOW_SCOPE && !(setup.authorizedAt > Date.parse(last.finishedAt));
  return Boolean(setup.missingScopes?.includes(FOLLOW_SCOPE) || scopeFailed || autoFailed);
}

function renderNotice() {
  const age = setup?.authAgeDays;
  const reason = noticeReason ?? (loginNeeded(scheduleInfo?.lastRun) ? 'auto' : scopeNeeded() ? 'scope' : age != null && age >= 170 ? 'age' : null);
  $('notice').hidden = view !== 'settings' || !reason;
  $('notice-login').hidden = reason === 'done';
  const left = 180 - (age ?? 0);
  $('notice-text').textContent = reason === 'done' ? T.notice.done
    : reason === 'auto' ? T.auto.notice
    : reason === 'expired' ? T.notice.expired
    : reason === 'scope' ? T.notice.scope
    : left > 0 ? T.notice.left(left)
    : T.notice.probably;
}

// --- Hinweis auf eine neue Version ---

// Ergebnis von GET /api/update. Ausgeblendet wird je Version: Eine neuere zeigt den Hinweis wieder.
let updateInfo = null;
const dismissedUpdate = store('tweakable-dj-update-dismissed');
const githubLink = u => typeof u === 'string' && /^https:\/\/github\.com\//.test(u);
const bare = v => String(v ?? '').replace(/^v/i, '');

// „Jetzt aktualisieren“: phase '' (nichts), 'confirm' (Rückfrage), 'running', 'done' (Neustart läuft), 'manual'
// (ohne Startdatei gestartet: bitte selbst neu starten), 'slow' (Neustart dauert), 'error'.
// text: letzte Zeile des Fortschritts bzw. Fehlermeldung des Servers; to: neue Version.
let upd = { phase: '', text: '', to: '' };
let reloading = false; // Seite lädt nach dem Update neu: dann nicht wegen ungespeicherter Änderungen nachfragen
const updating = () => upd.phase === 'running';

function renderUpdate() {
  const u = updateInfo;
  const phase = upd.phase;
  // Abgeschaltet, Fehler, aktuell oder schon weggeklickt: nichts anzeigen (außer ein Update ist schon angestoßen).
  const available = Boolean(u?.enabled && u.updateAvailable && !u.error && u.latest && githubLink(u.url));
  const show = Boolean(phase) || (available && dismissedUpdate.get() !== u.latest);
  $('update').hidden = !show;
  if (show && u?.latest) {
    $('update-text').textContent = T.update.text(u.latest, u.current);
    $('update-link').textContent = T.update.link;
    $('update-link').href = githubLink(u.url) ? u.url : '';
  }
  $('update-install').textContent = T.update.install;
  $('update-install').hidden = !(u?.installable && available && ['', 'error'].includes(phase));
  $('update-close').hidden = !['', 'confirm', 'error'].includes(phase);
  $('update-close').title = T.update.close;
  $('update-close').setAttribute('aria-label', T.update.close);
  // Rückfrage mit Link auf die Versionshinweise (Release-Seite)
  $('update-confirm').hidden = phase !== 'confirm';
  if (phase === 'confirm') {
    $('update-confirm-text').textContent = T.update.confirm(bare(u.current), bare(u.latest));
    $('update-notes').textContent = T.update.notes;
    $('update-notes').href = u.url;
    $('update-go').textContent = T.update.go;
    $('update-cancel').textContent = T.update.cancel;
  }
  // Fortschritt bzw. Ergebnis
  $('update-state').hidden = !['running', 'done', 'manual', 'slow', 'error'].includes(phase);
  const msg = phase === 'running' ? upd.text || T.update.starting
    : phase === 'done' ? T.update.done(upd.to)
    : phase === 'manual' ? T.update.manual(upd.to)
    : phase === 'slow' ? T.update.slow
    : phase === 'error' ? upd.text || T.update.failed : '';
  setMsg($('update-msg'), { done: 'ok', manual: 'ok', slow: 'warn', error: 'err' }[phase] ?? '', msg);
  // Eigene Version dezent unten auf der Seite, sobald sie bekannt ist.
  const version = typeof u?.current === 'string' ? bare(u.current) : '';
  $('version').hidden = !version;
  $('version').textContent = version ? `v${version}` : '';
}

function setUpdate(state) {
  upd = { text: '', to: upd.to, ...state };
  renderUpdate();
  if (loaded) refresh();
}

// Update auf Klick nach der Rückfrage: ungespeicherte Änderungen zuerst speichern (wie vor einem Lauf), dann den
// Fortschritt des Servers zeigen. Danach beendet sich der Server; die Seite wartet auf den neuen und lädt sich neu.
async function installUpdate() {
  const to = updateInfo?.latest;
  showError('');
  try {
    if (loaded && dirty()) await save();
  } catch (e) {
    return setUpdate({ phase: 'error', text: e.message, to });
  }
  setUpdate({ phase: 'running', to });
  let result;
  try {
    const res = await api('/api/update/install', { method: 'POST', body: JSON.stringify({ version: to }) });
    if (!res.ok) throw new Error((await res.json()).error);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let text = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      text += decoder.decode(value, { stream: true });
      // letzte vollständige Zeile ohne Steuerzeilen (@@…)
      const lines = text.replace(/\r/g, '').split('\n').slice(0, -1).filter(l => l.trim() && !l.startsWith('@@'));
      if (lines.length) setUpdate({ phase: 'running', text: lines[lines.length - 1], to });
    }
    result = runResult(text + decoder.decode());
  } catch (e) {
    return setUpdate({ phase: 'error', text: e.message, to });
  }
  if (!result?.ok) return setUpdate({ phase: 'error', text: result?.error, to });
  setUpdate({ phase: result.restart ? 'done' : 'manual', to: result.to });
  waitForRestart(result.to);
}

// Warten, bis der neu gestartete Server mit der neuen Version antwortet, dann die Seite neu laden. Ohne Startdatei
// (phase 'manual') fragt die Seite weiter, bis jemand Tweakable DJ wieder startet.
async function waitForRestart(to) {
  const started = Date.now();
  for (;;) {
    await new Promise(resolve => setTimeout(resolve, 1000));
    try {
      if ((await apiJson('/api/version')).version === to) {
        reloading = true;
        location.reload();
        return;
      }
    } catch {
      // Server startet gerade neu
    }
    if (upd.phase === 'done' && Date.now() - started > 45_000) setUpdate({ phase: 'slow', to });
  }
}

// Einmal nach dem Laden, ohne dass die Seite darauf wartet. Klappt die Abfrage nicht, bleibt der Hinweis eben weg.
async function loadUpdate() {
  try {
    updateInfo = await apiJson('/api/update');
  } catch {
    updateInfo = null;
  }
  renderUpdate();
}

function dismissUpdate() {
  dismissedUpdate.set(updateInfo?.latest);
  setUpdate({ phase: '' });
}

// --- Einrichtungs-Assistent ---

const stepEls = [...document.querySelectorAll('.step')];
const firstOpenStep = () => (STEPS.findIndex(done => !done(setup)) + 1) || 1;

function renderHeader() {
  $('sub').textContent = view ? T.sub[view] : '';
  document.title = T.title(view);
  if (!loaded) $('status').textContent = loadFailed ? T.status.error : T.status.loading;
}

function showView(name) {
  view = name;
  $('setup').hidden = name !== 'setup';
  $('settings').hidden = name !== 'settings';
  $('bar').hidden = name !== 'settings';
  $('main').classList.toggle('no-bar', name !== 'settings');
  $('open-setup').hidden = name !== 'settings';
  renderHeader();
  refresh();
  renderNotice();
}

function openSetup(step, manual = false) {
  fromSettings = manual;
  $('w-client').value = setup.credentials.clientId;
  $('w-key').value = setup.credentials.apiKey;
  $('w-user').value = setup.credentials.user;
  fillSeedSelect($('w-seed'), saved.seed);
  checkClientId();
  setMsg($('w-lastfm-msg'), '', '');
  showView('setup');
  openStep(step ?? firstOpenStep());
}

function openStep(n, focus = false) {
  activeStep = n;
  renderSetup();
  const head = stepEls[n - 1].querySelector('.step-head');
  if (focus) head.focus();
  stepEls[n - 1].scrollIntoView({ block: 'nearest' });
}

function renderSetup() {
  if (!setup) return;
  stepEls.forEach((li, i) => {
    const done = STEPS[i](setup);
    const active = activeStep === i + 1;
    li.classList.toggle('done', done);
    li.classList.toggle('active', active);
    li.querySelector('.step-head').setAttribute('aria-expanded', String(active));
    li.querySelector('.step-body').hidden = !active;
    li.querySelector('.step-state').textContent = done ? T.setup.done : '';
  });
  $('redirect-uri').textContent = setup.redirectUri;
  $('w-login-state').textContent = setup.loggedIn ? T.setup.loggedIn(setup.authAgeDays) : T.setup.notLoggedIn;
  $('w-login-next').disabled = !setup.loggedIn;
  const open = STEPS.slice(0, 4).map((done, i) => (done(setup) ? 0 : i + 1)).filter(Boolean);
  $('w-done-text').textContent = open.length ? T.setup.open(open) : T.setup.allDone;
  $('w-finish').disabled = setup.needsSetup;
  $('w-close').hidden = setup.needsSetup || !fromSettings;
  renderLogin();
}

async function saveSetup(values) {
  // Legt der Assistent gerade die config.jsonc an, kommt die Sprache der Seite gleich mit hinein (siehe adoptLang).
  configCreated = !setup?.configExists;
  try {
    await apiJson('/api/setup', { method: 'POST', body: JSON.stringify(values) });
    await load(true);
  } finally {
    configCreated = false;
  }
}

// Formatprüfung beim Tippen: 32 Zeichen aus 0–9 und a–f. true = passt.
function checkClientId() {
  const id = $('w-client').value.trim();
  const msg = $('w-client-msg');
  const ok = /^[0-9a-f]{32}$/i.test(id);
  const bad = /[^0-9a-f]/i.test(id);
  if (!id) setMsg(msg, '', '');
  else if (ok) setMsg(msg, 'ok', T.setup.formatOk);
  else if (bad) setMsg(msg, 'err', T.setup.badChars);
  else setMsg(msg, id.length > 32 ? 'err' : '', T.setup.length(id.length));
  return ok;
}

async function saveClientId() {
  if (!checkClientId()) {
    if (!$('w-client').value.trim()) setMsg($('w-client-msg'), 'err', T.setup.pasteId);
    return $('w-client').focus();
  }
  const id = $('w-client').value.trim();
  const changed = setup.loggedIn && setup.credentials.clientId && setup.credentials.clientId.toLowerCase() !== id.toLowerCase();
  try {
    await saveSetup({ clientId: id });
    if (changed) {
      setLogin({ status: 'idle', message: '', key: 'newClientId' });
      openStep(3, true);
    } else {
      openStep(2, true);
    }
  } catch (e) {
    setMsg($('w-client-msg'), 'err', e.message);
  }
}

const lastfmInput = () => ({ apiKey: $('w-key').value.trim(), user: $('w-user').value.trim() });

async function checkLastfm() {
  const input = lastfmInput();
  const box = $('w-lastfm-msg');
  setMsg(box, '', T.setup.checking);
  const r = await apiJson('/api/lastfm', { method: 'POST', body: JSON.stringify(input) });
  if (!r.ok) setMsg(box, 'err', r.message);
  else if (r.scrobbles === 0) {
    setMsg(box, 'warn', r.message, T.setup.connect,
      el('a', { href: LASTFM_APPS, target: '_blank', rel: 'noopener', textContent: T.setup.connectLink }),
      T.setup.connectRest);
  } else setMsg(box, 'ok', r.message);
  return r;
}

async function saveLastfm() {
  const input = lastfmInput();
  try {
    // Gespeichert und mit Hinweis stehen geblieben? Dann nur weiter.
    if ($('w-lastfm-save').dataset.saved === JSON.stringify(input)) return openStep(3, true);
    const r = await checkLastfm();
    if (!r.ok && (r.kind === 'key' || r.kind === 'user')) return;
    await saveSetup(input);
    if (r.ok && r.scrobbles !== 0) return openStep(3, true);
    // Mit Hinweis (keine Scrobbles oder nicht prüfbar) stehen bleiben, damit man ihn lesen kann.
    $('w-lastfm-msg').prepend(r.ok ? T.setup.saved : T.setup.savedUnchecked);
    $('w-lastfm-save').dataset.saved = JSON.stringify(input);
    $('w-lastfm-save').textContent = T.page.next;
  } catch (e) {
    setMsg($('w-lastfm-msg'), 'err', e.message);
  }
}

function resetLastfmButton() {
  delete $('w-lastfm-save').dataset.saved;
  $('w-lastfm-save').textContent = T.page.saveNext;
}

async function saveSeed() {
  try {
    await saveSetup({ seed: $('w-seed').value });
    current.seed = saved.seed;
    refresh();
    openStep(5, true);
  } catch (e) {
    seedNote = { key: 'raw', msg: e.message };
    $('w-seed-note').textContent = e.message;
  }
}

let copyTimer = null;
async function copyRedirectUri() {
  const text = $('redirect-uri').textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    const range = document.createRange();
    range.selectNodeContents($('redirect-uri'));
    getSelection().removeAllRanges();
    getSelection().addRange(range);
    document.execCommand('copy');
  }
  $('copy-uri').textContent = T.page.copied;
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => { $('copy-uri').textContent = T.page.copy; }, 2000);
}

function wireSetup() {
  stepEls.forEach((li, i) => { li.querySelector('.step-head').onclick = () => openStep(i + 1); });
  $('copy-uri').onclick = copyRedirectUri;
  $('w-client').oninput = checkClientId;
  $('w-client').onkeydown = e => { if (e.key === 'Enter') saveClientId(); };
  $('w-client-save').onclick = saveClientId;
  $('w-key').oninput = $('w-user').oninput = resetLastfmButton;
  $('w-lastfm-check').onclick = () => checkLastfm().catch(e => setMsg($('w-lastfm-msg'), 'err', e.message));
  $('w-lastfm-save').onclick = saveLastfm;
  loginBox($('w-login'), () => (setup?.loggedIn ? T.login.again : T.login.start));
  loginBox($('notice-login'), () => T.login.start);
  $('w-login-next').onclick = () => openStep(4, true);
  $('w-seed-save').onclick = saveSeed;
  $('w-finish').onclick = () => { showView('settings'); scrollTo(0, 0); };
  $('w-close').onclick = () => { showView('settings'); scrollTo(0, 0); };
  $('open-setup').onclick = () => openSetup(1, true);
}

for (const b of document.querySelectorAll('.lang button')) b.onclick = () => setLang(b.dataset.lang);
$('save').onclick = () => save().catch(e => showError(e.message));
$('discard').onclick = () => { current = { ...saved }; refresh(); };
$('dry').onclick = () => run('dry');
$('run').onclick = () => run('run');
$('trial-apply').onclick = applyTrial;
$('trial-export').onclick = exportTrial;
$('export').onclick = exportPlaylist;
$('import').onclick = () => $('import-file').click();
$('import-file').onchange = () => {
  const file = $('import-file').files[0];
  $('import-file').value = ''; // dieselbe Datei noch einmal wählen löst wieder change aus
  if (file) importPreview(file);
};
$('import-go').onclick = importWrite;
$('import-cancel').onclick = () => setImport(null);
$('update-close').onclick = dismissUpdate;
$('update-install').onclick = () => {
  setUpdate({ phase: 'confirm' });
  $('update-go').focus();
};
$('update-cancel').onclick = () => {
  setUpdate({ phase: '' });
  $('update-install').focus();
};
$('update-go').onclick = installUpdate;
window.addEventListener('beforeunload', e => { if (dirty() && !reloading) e.preventDefault(); });
// Zurück auf der Seite (z. B. am nächsten Morgen): Stand der Automatik und letzten Lauf neu holen.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || view !== 'settings') return;
  loadSchedule();
  if (trial) refreshTrial();
});

wireSetup();
renderLang();
load().then(async () => {
  if (setup.needsSetup || ['#einrichtung', '#setup'].includes(location.hash)) openSetup(undefined, !setup.needsSetup);
  else showView('settings');
  loadPlaylists();
  loadSchedule();
  // Läuft noch eine Anmeldung (z. B. nach Neuladen der Seite)? Dann weiter verfolgen.
  const state = await apiJson('/api/login').catch(() => null);
  if (state?.status === 'pending') setLogin(state);
}).catch(e => {
  loadFailed = true;
  showError(T.setup.loadFailed(e.message));
  renderHeader();
});
loadUpdate(); // parallel zum Laden der Einstellungen
</script>
