<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tweakable DJ for Spotify</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #16181d;
    --muted: #5d6470;
    --border: #e1e4e9;
    --accent: #1b8f4d;
    --accent-soft: #e6f4ec;
    --warn: #a66300;
    --danger: #b3261e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e8eaed;
      --muted: #9aa1ad;
      --border: #2a2f3a;
      --accent: #3ecf7a;
      --accent-soft: #1b2c22;
      --warn: #f0b049;
      --danger: #ff8a80;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 120px; }
  main.no-bar { padding-bottom: 32px; }
  /* Kopf: Titel | Zugangsdaten + Status | Sprache. Auf schmalen Bildschirmen rutscht die Mitte in die zweite Zeile. */
  header { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 10px 14px; margin-bottom: 20px; }
  h1 { font-size: 26px; margin: 0; letter-spacing: -.01em; }
  .tagline { margin: 2px 0 0; font-size: 14px; }
  .sub { color: var(--muted); margin: 2px 0 0; }
  .head-side { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  @media (max-width: 600px) {
    header { grid-template-columns: 1fr auto; align-items: start; }
    .head-side { grid-column: 1 / -1; grid-row: 2; }
    h1 { font-size: 22px; }
  }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; }
  .chip.dirty { color: var(--warn); border-color: currentColor; }
  /* Sprachwahl: sichtbar nur das Kürzel („DE ▾“); darüber liegt unsichtbar ein echtes <select>, das Klicks, Tastatur,
     Screenreader und auf dem Handy die Auswahlliste des Systems übernimmt. */
  .lang { position: relative; display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); padding: 4px 9px 4px 11px; font-size: 13px; font-weight: 600; letter-spacing: .03em; line-height: 1.5; color: var(--muted); white-space: nowrap; }
  .lang .caret { font-size: 10px; letter-spacing: 0; }
  .lang:hover { color: var(--accent); border-color: var(--accent); }
  .lang select { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; border-radius: 999px; opacity: 0; cursor: pointer; font-size: 16px; color-scheme: light dark; }
  .lang:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .lang:focus-within:not(:has(select:focus-visible)) { outline: none; }
  .banner { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; background: var(--card); border: 1px solid var(--danger); color: var(--danger); }
  .notice { padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; background: var(--card); border: 1px solid var(--warn); }
  .notice > p { margin: 0; font-weight: 600; }
  /* Hinweis auf eine neue Version: Rahmen in der Akzentfarbe, mit × zum Ausblenden (wie bei der Sperrliste).
     Text | „Jetzt aktualisieren“ | ×; auf schmalen Bildschirmen rutscht die Schaltfläche unter den Text.
     Darunter (über die ganze Breite) Rückfrage, Fortschritt und Ergebnis des Updates. */
  .update { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; padding: 8px 6px 8px 14px; border-radius: 10px; margin-bottom: 16px; background: var(--card); border: 1px solid var(--accent); }
  .update > p { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .update a { font-weight: 600; white-space: nowrap; }
  .update .close { flex: none; font: inherit; font-size: 17px; line-height: 1; width: 28px; height: 28px; border-radius: 50%; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .update .close:hover { background: var(--border); color: var(--text); }
  .update-panel { grid-column: 1 / -1; padding-right: 8px; }
  .update-panel p { margin: 0 0 8px; }
  .update-panel .actions { margin-top: 0; }
  .update-panel .msg { margin: 0 0 4px; }
  .update-panel a { white-space: normal; }
  @media (max-width: 520px) {
    .update { grid-template-columns: 1fr auto; }
    .update > #update-install { grid-column: 1; grid-row: 2; justify-self: start; }
    .update > .close { grid-column: 2; grid-row: 1; }
  }
  button.link { font: inherit; font-size: 13.5px; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }

  section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 6px 18px; margin-bottom: 16px; box-shadow: var(--shadow); }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; }
  .row { padding: 14px 0; border-top: 1px solid var(--border); }
  section h2 + .row { border-top: 0; }
  .row-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .row-head label { font-weight: 600; }
  output { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); white-space: nowrap; }
  input[type=range] { width: 100%; margin: 10px 0 2px; accent-color: var(--accent); }
  .scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .hint { margin: 6px 0 0; font-size: 13.5px; color: var(--accent); }
  .hint:empty { display: none; }
  .help { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
  .help:empty { display: none; }
  .reset { margin-top: 6px; font-size: 12.5px; background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; }
  input[type=text], select { width: 100%; margin-top: 8px; padding: 9px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }

  .switch { position: relative; width: 44px; height: 26px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--border); transition: background .15s; pointer-events: none; }
  .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* „Details für Fortgeschrittene“ unter einem Hauptregler (Abwechslung bei Künstlern) */
  details.more { border-top: 1px solid var(--border); padding: 10px 0 4px; }
  details.more > summary { cursor: pointer; font-weight: 600; color: var(--muted); font-size: 14px; }
  details.more > summary:hover { color: var(--text); }
  details.more[open] > summary { margin-bottom: 4px; }

  /* Voreinstellungen */
  .preset-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0 8px; }
  .preset { text-align: left; font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  .preset b { display: block; margin-bottom: 2px; }
  .preset span { display: block; font-size: 13px; color: var(--muted); }
  .preset[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .preset[aria-pressed="true"] b::after { content: " ✓"; color: var(--accent); }
  #preset-state { margin: 0 0 14px; }

  /* Sperrliste */
  .add-row { display: flex; gap: 8px; margin-top: 8px; }
  .add-row input[type=text] { margin-top: 0; min-width: 0; }
  .add-row .btn { flex: none; }
  .tags { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 10px 0 0; }
  .tag { display: inline-flex; align-items: center; gap: 2px; padding: 2px 3px 2px 11px; border-radius: 999px; background: var(--accent-soft); border: 1px solid var(--border); font-size: 14px; }
  .tag button { font: inherit; font-size: 17px; line-height: 1; width: 26px; height: 26px; border-radius: 50%; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .tag button:hover { background: var(--border); color: var(--text); }
  .tags .empty { color: var(--muted); font-size: 13.5px; }
  /* Song sperren: × hinter jedem Song in der Liste eines Probelaufs; gesperrte Songs durchgestrichen (↺ hebt die Sperre auf) */
  pre .blocked { text-decoration: line-through; opacity: .55; }
  pre button.block { font: inherit; font-size: 12px; line-height: 1.2; padding: 0 6px; margin-left: 6px; border: 1px solid var(--border); border-radius: 999px; background: none; color: var(--muted); cursor: pointer; }
  pre button.block:hover { color: var(--danger); border-color: currentColor; }
  pre button.block.undo:hover { color: var(--accent); }

  /* Automatik */
  .row-head .label { font-weight: 600; }
  .seg { display: flex; margin-top: 8px; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; background: var(--bg); }
  .seg label { flex: 1; min-width: 0; position: relative; }
  .seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .seg input:disabled { cursor: default; }
  .seg span { display: block; padding: 8px 6px; text-align: center; font-weight: 600; color: var(--muted); }
  .seg label + label span { border-left: 1px solid var(--border); }
  .seg input:checked + span { background: var(--accent-soft); color: var(--accent); }
  .seg input:disabled + span { opacity: .5; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }
  input[type=time] { margin-top: 8px; padding: 8px 11px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; color-scheme: light dark; }
  select.short, input[type=time] { display: block; width: auto; min-width: 160px; max-width: 100%; }
  .facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; margin: 0; font-size: 14px; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; font-weight: 600; }
  .facts .ok { color: var(--accent); }
  .facts .err { color: var(--danger); }
  #auto-status > * + * { margin-top: 8px; }
  .notify-test { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 8px; }
  .notify-test .msg { margin: 0; flex: 1 1 220px; min-width: 0; overflow-wrap: anywhere; }
  .auto-problem { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--warn); }
  .auto-problem p { margin: 0 0 8px; font-size: 14px; }
  @media (max-width: 480px) {
    .facts { grid-template-columns: 1fr; gap: 0; }
    .facts dd + dt { margin-top: 6px; }
  }

  /* Einrichtung */
  .intro { margin: 0 0 16px; color: var(--muted); }
  .steps { list-style: none; padding: 0; margin: 0; }
  .step { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .step.active { border-color: var(--accent); }
  .step h2 { margin: 0; font-size: inherit; }
  .step-head { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 18px; background: none; border: 0; border-radius: 14px; font: inherit; font-weight: 600; color: var(--text); text-align: left; cursor: pointer; }
  .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border); font-size: 14px; color: var(--muted); }
  .step.active .num { border-color: var(--accent); color: var(--accent); }
  .step.done .num { background: var(--accent); border-color: var(--accent); color: var(--card); }
  .step-state { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--muted); white-space: nowrap; }
  .step.done .step-state { color: var(--accent); }
  .step-body { padding: 0 18px 18px; }
  .step-body > p:first-child { margin-top: 0; }
  .howto { padding-left: 22px; margin: 8px 0 14px; }
  .howto li { margin-bottom: 8px; }
  .field { margin-top: 14px; }
  .field label { display: block; font-weight: 600; }
  .copy { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0 2px; }
  code { font: 13.5px ui-monospace, "Cascadia Mono", Consolas, monospace; padding: 5px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); word-break: break-all; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .msg { margin: 8px 0 0; font-size: 14px; }
  .msg:empty { display: none; }
  .msg.ok { color: var(--accent); }
  .msg.err { color: var(--danger); }
  .msg.warn { color: var(--warn); }
  .login-box .actions { margin-top: 10px; }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--border); }
  .bar-inner { max-width: 760px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  button.btn { font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; }
  button.btn.small { padding: 5px 10px; font-size: 13.5px; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { button.btn.primary { color: #0b1a11; } }
  button.btn:disabled { opacity: .5; cursor: default; }

  .out-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 14px 0 8px; }
  .summary { font-weight: 600; }
  .open { font-weight: 600; color: var(--accent); }
  /* Probelauf übernehmen (unter der Ausgabe) und Textdatei */
  #trial { margin: -4px 0 16px; }
  #trial .actions, #files .actions { margin-top: 0; }
  #files .row > .help { margin: 0 0 10px; }
  .import-preview { margin-top: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); }
  .import-preview > p { margin: 0 0 8px; }
  .import-missing { margin: 0 0 10px; padding-left: 20px; max-height: 220px; overflow: auto; font-size: 13.5px; overflow-wrap: anywhere; }
  .import-missing li { margin-bottom: 2px; }
  .import-missing .why { color: var(--muted); }
  #import-hints-head { color: var(--warn); }
  pre { margin: 0 0 16px; padding: 12px; max-height: 480px; overflow: auto; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); font: 12.5px/1.55 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre-wrap; word-break: break-word; }
  pre .now { color: var(--accent); }
  pre .warn { color: var(--warn); }
  pre .err { color: var(--danger); font-weight: 600; }

  .credit { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; }
  .credit p { margin: 2px 0; }
  .credit a { color: inherit; }
  .credit .version { margin-top: 6px; opacity: .85; }
  .credit .mt-note { margin-bottom: 6px; font-style: italic; }
  .credit .mt-note:empty { display: none; }
  /* „Nach Updates suchen“: dezent wie ein Link, Ergebnis gleich daneben */
  .credit button.link { font-size: inherit; color: inherit; }
  .credit button.link:disabled { opacity: .6; cursor: default; }
  #update-check-msg.ok { color: var(--accent); }
  #update-check-msg.err { color: var(--danger); }
</style>
</head>
<body>
<!-- Alle Texte stehen unten im Skript in TEXT.de, TEXT.en, TEXT.es und TEXT.fr (page): data-t = Text, data-html = Text mit Auszeichnung, data-ph = Platzhalter. -->
<main id="main">
  <header>
    <div>
      <h1>Tweakable DJ for Spotify</h1>
      <p class="tagline" data-t="tagline"></p>
      <p class="sub" id="sub"></p>
    </div>
    <div class="head-side">
      <button type="button" class="link" id="open-setup" data-t="openSetup" hidden></button>
      <span id="status" class="chip" role="status"></span>
    </div>
    <!-- Sprachwahl: Namen der Sprachen in der jeweiligen Sprache; Beschriftung (aria-label, title) aus TEXT (page.language) -->
    <label class="lang" id="lang-box">
      <span id="lang-code" aria-hidden="true">DE</span><span class="caret" aria-hidden="true">▾</span>
      <select id="lang">
        <option value="de" lang="de">Deutsch</option>
        <option value="en" lang="en">English</option>
        <option value="es" lang="es">Español</option>
        <option value="fr" lang="fr">Français</option>
      </select>
    </label>
  </header>
  <div id="banner" class="banner" role="alert" hidden></div>
  <div id="notice" class="notice" hidden>
    <p id="notice-text"></p>
    <div id="notice-login"></div>
  </div>
  <!-- Neue Version auf GitHub (GET /api/update), ausblendbar je Version; „Jetzt aktualisieren“ mit Rückfrage (POST /api/update/install) -->
  <div id="update" class="update" hidden>
    <p role="status"><span id="update-text"></span> – <a id="update-link" target="_blank" rel="noopener"></a></p>
    <button type="button" class="btn small primary" id="update-install"></button>
    <button type="button" class="close" id="update-close">×</button>
    <div class="update-panel" id="update-confirm" hidden>
      <p id="update-confirm-text"></p>
      <p><a id="update-notes" target="_blank" rel="noopener"></a></p>
      <div class="actions">
        <button type="button" class="btn primary" id="update-go"></button>
        <button type="button" class="btn" id="update-cancel"></button>
      </div>
    </div>
    <div class="update-panel" id="update-state" role="status" aria-live="polite" hidden>
      <p class="msg" id="update-msg"></p>
    </div>
  </div>

  <!-- Einrichtungs-Assistent -->
  <div id="setup" hidden>
    <p class="intro" data-t="intro"></p>
    <ol class="steps">
      <li class="step">
        <h2><button type="button" class="step-head" aria-controls="step-1"><span class="num">1</span><span data-t="step1"></span><span class="step-state"></span></button></h2>
        <div class="step-body" id="step-1" hidden>
          <p data-t="s1Text"></p>
          <ol class="howto">
            <li data-html="s1Dashboard"></li>
            <li data-html="s1Create"></li>
            <li><span data-html="s1Redirect"></span>
              <span class="copy"><code id="redirect-uri">http://127.0.0.1:8888/callback</code><button type="button" class="btn small" id="copy-uri" data-t="copy"></button></span>
              <span class="help" data-t="s1Exact"></span></li>
            <li data-html="s1Api"></li>
            <li data-html="s1ClientId"></li>
          </ol>
          <div class="field">
            <label for="w-client">Client ID</label>
            <input type="text" id="w-client" autocomplete="off" spellcheck="false" maxlength="64" data-ph="hexPh" aria-describedby="w-client-msg">
            <p class="msg" id="w-client-msg" role="status"></p>
          </div>
          <div class="actions"><button type="button" class="btn primary" id="w-client-save" data-t="saveNext"></button></div>
        </div>
      </li>
      <li class="step">
        <h2><button type="button" class="step-head" aria-controls="step-2"><span class="num">2</span><span data-t="step2"></span><span class="step-state"></span></button></h2>
        <div class="step-body" id="step-2" hidden>
          <p data-t="s2Text"></p>
          <ol class="howto">
            <li data-html="s2Account"></li>
            <li data-html="s2Form"></li>
            <li data-html="s2Key"></li>
          </ol>
          <div class="field">
            <label for="w-key" data-t="apiKey"></label>
            <input type="text" id="w-key" autocomplete="off" spellcheck="false" maxlength="64" data-ph="hexPh">
          </div>
          <div class="field">
            <label for="w-user" data-t="user"></label>
            <input type="text" id="w-user" autocomplete="off" spellcheck="false" maxlength="30" aria-describedby="w-user-help">
            <p class="help" id="w-user-help" data-html="userHelp"></p>
          </div>
          <div class="msg" id="w-lastfm-msg" role="status"></div>
          <div class="actions">
            <button type="button" class="btn" id="w-lastfm-check" data-t="check"></button>
            <button type="button" class="btn primary" id="w-lastfm-save"></button>
          </div>
        </div>
      </li>
      <li class="step">
        <h2><button type="button" class="step-head" aria-controls="step-3"><span class="num">3</span><span data-t="step3"></span><span class="step-state"></span></button></h2>
        <div class="step-body" id="step-3" hidden>
          <p data-t="s3Text"></p>
          <p id="w-login-state" class="help"></p>
          <div id="w-login"></div>
          <div class="actions"><button type="button" class="btn" id="w-login-next" data-t="next"></button></div>
        </div>
      </li>
      <li class="step">
        <h2><button type="button" class="step-head" aria-controls="step-4"><span class="num">4</span><span data-t="step4"></span><span class="step-state"></span></button></h2>
        <div class="step-body" id="step-4" hidden>
          <p data-t="s4Text"></p>
          <div class="field">
            <label for="w-seed" data-t="step4"></label>
            <select id="w-seed" aria-describedby="w-seed-help"></select>
            <p class="help" id="w-seed-help" data-t="s4Help"></p>
            <p class="msg warn" id="w-seed-note" role="status"></p>
          </div>
          <div class="actions"><button type="button" class="btn primary" id="w-seed-save" data-t="saveNext"></button></div>
        </div>
      </li>
      <li class="step">
        <h2><button type="button" class="step-head" aria-controls="step-5"><span class="num">5</span><span data-t="step5"></span><span class="step-state"></span></button></h2>

    <div id="groups"></div>

    <section id="files" aria-labelledby="files-title">

        <p class="msg" id="files-msg" role="status" aria-live="polite"></p>

        </div>
      </div>
    </section>
    <section id="out" hidden>
      <div class="out-head">
        <span id="summary" class="summary"></span>
        <a id="open" class="open" target="_blank" rel="noopener" data-t="open" hidden></a>
      </div>
      <pre id="log"></pre>

      <div id="trial" hidden>

        </div>
        <p class="msg" id="trial-msg" role="status"></p>
      </div>
    </section>
  </div>

  <footer class="credit">

</main>

// --- Sprache: Config (language) → vorgemerkte Wahl in diesem Browser → Sprache des Browsers ---

// Kleiner Speicher im Browser; kann fehlen oder gesperrt sein (z. B. privates Fenster), dann eben ohne.
const store = key => ({
  get() { try { return localStorage.getItem(key); } catch { return null; } },
  set(v) { try { if (v) localStorage.setItem(key, v); else localStorage.removeItem(key); } catch { /* egal */ } },
});
// Wahl, die noch nicht in der config.jsonc steht (Speichern fehlgeschlagen) – wird beim nächsten Laden nachgereicht.
const pendingLang = store('tweakable-dj-language');
// Sprache des Browsers: de*, es*, fr* → diese Sprache, alles andere Englisch.
const browserLang = () => {
  const code = (navigator.language || '').slice(0, 2).toLowerCase();
  return Object.hasOwn(TEXT, code) ? code : 'en';
};
let lang = TEXT[pendingLang.get()] ? pendingLang.get() : browserLang();
let T = TEXT[lang];

const two = n => String(n).padStart(2, '0');
const num = v => Number(v).toLocaleString(T.locale, { maximumFractionDigits: 2 });
const pct = v => T.pct(v);
// Einzahl nach den Regeln der Sprache (Intl.PluralRules): de, en, es nur 1; fr 0 und 1. Ohne Intl: genau 1.
const pluralRules = {};
const isOne = n => {
  try {
    pluralRules[T.locale] ??= new Intl.PluralRules(T.locale);
    return pluralRules[T.locale].select(Number(n)) === 'one';
  } catch {
    return Number(n) === 1;
  }
};
const plural = (n, one, many) => `${num(n)} ${isOne(n) ? one : many}`;
// Hinweis zur Fensterregel mit der Höchstzahl pro Künstler in der ganzen Playlist; leer bei ungültigen Werten (z. B. Fenster 0).
const windowHint = (v, c, text) => {
  const n = Math.ceil(c.size * v / c.artistWindow);
  return Number.isFinite(n) ? text(n) : '';
};

// Gleiche Formel wie candidateWeight() in lineup.mjs.
function adventureHint(a) {
  const similar = 0.05 + (1 - a);
  const distant = 0.05 + a;
  const ratio = similar / distant;
  const lottery = ratio > 1.05 ? T.adventure.similar(num(ratio.toFixed(1)))
    : ratio < 0.95 ? T.adventure.distant(num((1 / ratio).toFixed(1)))
    : T.adventure.equal;
  return `${lottery} · ${T.adventure.detours(pct(a))}`;
}

// Gleiche Formel wie followedFactor() in lineup.mjs: −1 = gar nicht, 0 = egal, +1 = 10× so oft, dazwischen exponentiell.
const FOLLOWED_MAX = 10;
const followedLabel = v => T.followed.levels[v <= -1 ? 0 : v < 0 ? 1 : v === 0 ? 2 : v < 1 ? 3 : 4];
function followedHint(v) {
  if (v <= -1) return T.followed.none;
  if (v === 0) return T.followed.neutral;
  const x = num((FOLLOWED_MAX ** Math.abs(v)).toFixed(1));
  return v < 0 ? T.followed.fewer(x) : T.followed.more(x);
}

  const t = T.items[item.key];
  const fmt = t.fmt ?? (t.options ? v => t.options[v] ?? v : item.type === 'seed' ? seedName : v => v);

const LOGIN_CODES = ['login_expired', 'not_logged_in'];

const FOLLOW_SCOPE = 'user-follow-read';

const ITEMS = GROUPS.flatMap(g => g.items);
const $ = id => document.getElementById(id);
const el = (tag, props = {}, children = []) => Object.assign(document.createElement(tag), props).appendChildren(children);
Element.prototype.appendChildren = function (children) { children.forEach(c => c != null && c !== false && this.append(c)); return this; };
const attr = (node, attrs) => { for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v); return node; };
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

let saved = {};
let current = {};
let defaults = {};
let limits = {};             // erlaubte Bereiche und Regler der Zahlenwerte (LIMITS in config.mjs)

let scheduleBusy = false;

let configCreated = false;  // Assistent hat gerade die config.jsonc angelegt → Sprache mit hineinschreiben
let variety = { keys: [], levels: [] };   // Stufen von „Abwechslung bei Künstlern“ (VARIETY_LEVELS in config.mjs)
let varietyControl = null;  // Hauptregler samt Details-Bereich
let varietyOverwritten = false;   // eigene Werte gerade mit dem Hauptregler überschrieben → Hinweis
let scopeFailed = false;    // letzter Lauf: Anmeldung ohne Berechtigung für gefolgte Künstler (missingScope)
// Probelauf zum Übernehmen: { id, expiresAt, settings (Einstellungen beim Probelauf), serverReason, message } oder null
let trial = null;
let trialTimer = null;
let importRunning = false;  // Import aus einer Textdatei läuft (Suche oder Schreiben)
